name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # spectrum depends on one private sibling repo (transit; see
      # Cargo.toml), and a workflow's default GITHUB_TOKEN is scoped to THIS
      # repository only, so it cannot read it. This needs a token with read
      # access to the org's repos, stored as the DEPS_READ_TOKEN secret.
      #
      # The insteadOf rewrite below only takes effect because
      # .cargo/config.toml sets `net.git-fetch-with-cli = true` — cargo's
      # default libgit2 transport ignores git's url.*.insteadOf rewriting
      # entirely, so it would silently keep trying the unauthenticated
      # https://github.com/... URL and fail with the opaque "could not read
      # Username" error this step exists to prevent. That coupling is
      # load-bearing: deleting `git-fetch-with-cli = true` from
      # .cargo/config.toml silently breaks this authentication fix, and
      # nothing here would catch it happening.
      #
      # A MISSING SECRET IS NOT AN ERROR. It was, while transit was private:
      # no token meant no clone, and failing here gave a clear reason instead
      # of cargo's opaque one. Once it is public it is the opposite — an
      # anonymous clone is correct and refusing to build would be an outage
      # guarding nothing. So this step skips rather than fails, and the notice
      # below says exactly where the build will break if transit is in fact
      # still private. That keeps CI working across the switch, without
      # needing the secret's removal and the repo's publication to be
      # coordinated.
      - name: authenticate to the dependency repo, if it is still private
        env:
          DEPS_READ_TOKEN: ${{ secrets.DEPS_READ_TOKEN }}
        run: |
          if [ -z "${DEPS_READ_TOKEN}" ]; then
            echo "::notice::DEPS_READ_TOKEN is not set — cloning transit"
            echo "::notice::anonymously. That is correct once it is public. If"
            echo "::notice::it is still private, the build fails at the next"
            echo "::notice::cargo step with 'could not read Username'; set the"
            echo "::notice::secret to a fine-grained PAT with Contents:"
            echo "::notice::Read-only on the org's repos."
            exit 0
          fi
          git config --global \
            url."https://x-access-token:${DEPS_READ_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # Smoke coverage only. This does NOT redirect into results/ and does
      # NOT diff against a committed file: a wall-clock timing is never
      # byte-stable, so a `git diff --exit-code` guard on it would fail on
      # every run for reasons that have nothing to do with a code change.
      # results/mcp-remeasurement-sweep.md is the authoritative reading of one
      # real, measured sweep and is not regenerated here.
      - run: cargo run --release -- bench-mcp --tools 8
      - run: cargo run --release -- bench-mcp --tools 64

  # The paper is built to prove it still compiles. It is deliberately NOT
  # diff-gated against the committed PDF: tectonic stamps a CreationDate, so
  # two builds of identical sources differ byte-for-byte and the check would
  # fail on every run. Keeping paper/main.pdf current is a manual step.
  #
  # This job needs no DEPS_READ_TOKEN: it runs no cargo, so it never resolves
  # the private `transit` dependency.
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: WtfJoke/setup-tectonic@v3
      # No `-Z shell-escape`: this preamble omits `minted`, so the build has
      # no pygments dependency to satisfy here.
      - run: cd paper && tectonic main.tex
