[package]
name = "spectrum"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "A composition commitment for agent systems"
repository = "https://github.com/Task-force-for-AI-agents-in-Healthcare/spectrum"

[lib]
name = "spectrum"
path = "src/lib.rs"

[[bin]]
name = "spectrum"
path = "src/bin/spectrum.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
tiny_http = "0.12"

transit = { git = "https://github.com/Task-force-for-AI-agents-in-Healthcare/transit.git", rev = "3e10e13" }

[dev-dependencies]
tempfile = "3"
