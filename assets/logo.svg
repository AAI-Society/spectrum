<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="spectrum">
  <title>spectrum</title>
  <desc>A beam dispersed through a prism into its spectrum, crossed by dark absorption lines — how you establish what something is composed of without ever holding a piece of it, by reading the wavelengths that are missing.</desc>

  <rect width="256" height="256" rx="52" fill="#0A0A0A"/>

  <!-- the dispersing element: the apparatus, not the observation -->
  <path d="M82 58 L126 166 L38 166 Z"
        fill="none" stroke="#CFFF04" stroke-width="6"
        stroke-linejoin="round" opacity="0.32"/>

  <!-- the incident beam: undispersed, it tells you nothing about composition -->
  <line x1="14" y1="103" x2="66" y2="112" stroke="#CFFF04" stroke-width="8" stroke-linecap="round"/>

  <!-- the spectrum, with the absorption lines cut out of it: the dark bands
       are the whole measurement. Each one names a component that is present,
       and they are legible only once the beam has been spread out. -->
  <mask id="absorption">
    <path d="M114 94 L210 66 L210 198 L114 130 Z" fill="#fff"/>
    <rect x="140" y="52" width="11" height="156" fill="#000"/>
    <rect x="164" y="52" width="8" height="156" fill="#000"/>
    <rect x="184" y="52" width="13" height="156" fill="#000"/>
  </mask>
  <path d="M114 94 L210 66 L210 198 L114 130 Z" fill="#CFFF04" mask="url(#absorption)"/>
</svg>
